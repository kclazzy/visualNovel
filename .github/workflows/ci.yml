name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for i in 1 2 3 4 5; do sudo apt-get update && sudo apt-get install -y libasound2-dev && break || sleep 30; done; dpkg -s libasound2-dev > /dev/null
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: node --test player-web/tests/conformance.test.js
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p vn-studio -p vn-player
      - run: cargo test -p vn-core -p vn-store
