# Выпуск редактора: тег vX.Y.Z собирает архивы и публикует их в GitHub Releases.
# Оттуда их берёт кнопка «Обновить редактор».
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            suffix: windows
            ext: .exe
          - os: ubuntu-latest
            suffix: linux
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p vn-studio -p vn-player
      - name: Собрать архив
        shell: bash
        run: |
          mkdir dist
          cp target/release/vn-studio${{ matrix.ext }} target/release/vn-player${{ matrix.ext }} README.md CHANGELOG.md dist/
          cd dist
          if [ "${{ matrix.suffix }}" = "windows" ]; then 7z a ../vn-studio-${{ github.ref_name }}-windows.zip .; else zip -r ../vn-studio-${{ github.ref_name }}-linux.zip .; fi
      - name: Опубликовать
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --title "Visual Novel Studio ${{ github.ref_name }}" --notes-file CHANGELOG.md
          gh release upload "${{ github.ref_name }}" vn-studio-${{ github.ref_name }}-${{ matrix.suffix }}.zip --clobber
