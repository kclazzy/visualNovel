[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kclazzy/visualNovel"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vn-core = { path = "crates/vn-core" }
vn-store = { path = "crates/vn-store" }
vn-view = { path = "crates/vn-view" }

[profile.release]
opt-level = 2
strip = true

[profile.dev]
debug = 0
